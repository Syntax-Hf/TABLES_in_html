<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table in html5</title>
  </head>
  <body>
    <center>
      <h1>TABLE IN HTML</h1>
      <br /><br /><br />
      <table border="4">
        <thead>
          <tr>
            <th rowspan="2">Name</th>
            <th colspan="2">Details</th>
            <th rowspan="2">Country</th>
          </tr>
          <tr>
            <th>Age</th>
            <th>City</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>John Smith</td>
            <td>28</td>
            <td>New York</td>
            <td>USA</td>
          </tr>
          <tr>
            <td>Aisha Khan</td>
            <td>24</td>
            <td>Karachi</td>
            <td>Pakistan</td>
          </tr>
          <tr>
            <td>Lucas Martin</td>
            <td>31</td>
            <td>Paris</td>
            <td>France</td>
          </tr>
          <tr>
            <td>Priya Nair</td>
            <td>27</td>
            <td>Delhi</td>
            <td>India</td>
          </tr>
        </tbody>
      </table>
    </center>
    <br /><br /><br /><br />
    <hr />
    <details>&hearts;Prepared by Hurain</details>
  </body>
</html>
